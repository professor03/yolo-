      // Load data
      async function loadData() {
        try {
          const token = localStorage.getItem("access_token");
          if (!token) {
            console.log("loadData: No token available, skipping data load");
            return;
          }
          const headers = { Authorization: `Bearer ${token}` };

          // 並行載入所有數據
          const [metricsRes, camerasRes] = await Promise.allSettled([
            fetch("/api/v1/metrics", { headers }).then((res) =>
              res.ok ? res.json() : null
            ),
            fetch("/api/v1/cameras", { headers }).then((res) =>
              res.ok ? res.json() : null
            ),
          ]);

          // 處理 metrics
          if (metricsRes.status === "fulfilled" && metricsRes.value) {
            const payload = metricsRes.value.current || metricsRes.value;
            updateDashboard({ metrics: payload });
          }

          // 處理 cameras
          if (camerasRes.status === "fulfilled" && camerasRes.value) {
            const cameras = camerasRes.value.cameras || [];
            latestCameras = Array.isArray(cameras) ? cameras : [];
            updateCameraStatus(camerasRes.value.status);
            renderCameraManagement(cameras);
          }
        } catch (error) {
          console.error("Error loading data:", error);
        }
      }

      // Update dashboard
      function updateDashboard(data) {
        if (!data.metrics) {
          return;
        }

        const metrics = data.metrics || {};
        const people = toNumber(
          metrics.people_count ?? metrics.peopleCount ?? metrics.people,
          0
        );
        document.getElementById("peopleCount").textContent = Math.max(
          0,
          Math.round(people)
        );

        const fps = toNumber(metrics.fps_processing ?? metrics.fps, 0);
        document.getElementById("fpsProcessing").textContent = fps.toFixed(1);

        const latency = toNumber(metrics.latency_ms ?? metrics.latency, 0);
        document.getElementById("latency").textContent = latency.toFixed(1);

        const cpu = toNumber(metrics.cpu_percent ?? metrics.cpu_usage, 0);
        document.getElementById("cpuUsage").textContent = cpu.toFixed(1);

        updateChart(metrics);
        renderCameraMetrics(metrics.streams || {});
      }

      function renderCameraMetrics(streams) {
        const container = document.getElementById("cameraMetricsContainer");
        if (!container) return;

        container.innerHTML = "";
        const entries = Object.entries(streams || {});
        if (!entries.length) {
          container.innerHTML =
            "<p class='camera-metrics-empty'>目前沒有攝影機指標。</p>";
          return;
        }

        entries.forEach(([cameraId, info]) => {
          const card = document.createElement("div");
          card.className = "camera-metric-card";

          const title = document.createElement("div");
          title.className = "camera-metric-title";
          title.innerHTML = `<i class="fas fa-video"></i> ${cameraId}`;
          card.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "camera-metric-grid";

          const metricsList = [
            {
              label: "處理 FPS",
              value: toNumber(info.fps_processing ?? info.fps ?? 0, 0).toFixed(
                1
              ),
            },
            {
              label: "來源 FPS",
              value: toNumber(info.fps_source ?? 0, 0).toFixed(1),
            },
            {
              label: "延遲 (ms)",
              value: toNumber(info.latency_ms ?? 0, 0).toFixed(1),
            },
            {
              label: "CPU (%)",
              value: toNumber(info.cpu_percent ?? 0, 0).toFixed(1),
            },
          ];

          metricsList.forEach((metric) => {
            const item = document.createElement("div");
            item.className = "camera-metric-item";
            item.innerHTML = `
                    <div class="camera-metric-value">${metric.value}</div>
                    <div class="camera-metric-label">${metric.label}</div>
                  `;
            grid.appendChild(item);
          });

          card.appendChild(grid);
          container.appendChild(card);
        });
      }

      // Update chart
      function updateChart(metrics) {
        const now = new Date().toLocaleTimeString();
        const fps = toNumber(metrics.fps_processing ?? metrics.fps, 0);
        const people = toNumber(
          metrics.people_count ?? metrics.peopleCount ?? metrics.people,
          0
        );
        metricsChart.data.labels.push(now);
        metricsChart.data.datasets[0].data.push(fps);
        metricsChart.data.datasets[1].data.push(people);

        if (metricsChart.data.labels.length > 20) {
          metricsChart.data.labels.shift();
          metricsChart.data.datasets[0].data.shift();
          metricsChart.data.datasets[1].data.shift();
        }

        metricsChart.update("none");
      }

      // Update camera status
      function updateCameraStatus(status) {
        const statusDiv = document.getElementById("cameraStatus");
        if (!statusDiv) return;

        if (status) {
          lastKnownCameraStatus = {
            ...(lastKnownCameraStatus || {}),
            ...status,
          };
        }

        if (!lastKnownCameraStatus) {
          statusDiv.textContent = "目前沒有攝影機資訊";
          return;
        }

        const merged = lastKnownCameraStatus;
        const available = toNumber(merged.available_cameras, 0);
        const online = toNumber(merged.online_cameras ?? merged.online, 0);
        const isRunning = Boolean(merged.is_running);
        const lastUpdateDate = parseTimestamp(merged.last_update);
        const lastUpdateMs = lastUpdateDate ? lastUpdateDate.getTime() : null;
        const now = Date.now();
        const isFresh =
          lastUpdateMs !== null &&
          now - lastUpdateMs < CAMERA_OFFLINE_THRESHOLD;
        const effectiveRunning = isRunning && isFresh;
        const color = effectiveRunning ? "#10b981" : "#ef4444";
        const lastUpdate = lastUpdateMs
          ? formatDateTime(merged.last_update)
          : "-";

        // 修正上線攝影機計算 - 使用 latestCameras 而不是 merged.cameras
        const actuallyOnline = latestCameras
          ? latestCameras.filter((cam) => {
              if (!cam?.enabled) return false;
              const camLastSeen = cam.status?.last_seen;
              if (!camLastSeen) return false;
              try {
                // 處理不同的時間格式
                let camLastSeenDate;
                if (camLastSeen.includes("T") && camLastSeen.includes("Z")) {
                  // ISO 格式帶 Z
                  camLastSeenDate = new Date(camLastSeen);
                } else if (camLastSeen.includes("T")) {
                  // ISO 格式不帶 Z
                  camLastSeenDate = new Date(camLastSeen + "Z");
                } else {
                  // 其他格式
                  camLastSeenDate = new Date(camLastSeen);
                }

                const timeSinceLastSeen = now - camLastSeenDate.getTime();
                const isOnline =
                  cam.status?.online &&
                  timeSinceLastSeen < CAMERA_OFFLINE_THRESHOLD;

                // 調試信息
                console.log(
                  `Camera ${cam.slug}: online=${
                    cam.status?.online
                  }, lastSeen=${camLastSeen}, parsedDate=${camLastSeenDate.toISOString()}, timeSince=${timeSinceLastSeen}ms, threshold=${CAMERA_OFFLINE_THRESHOLD}ms, result=${isOnline}`
                );

                return isOnline;
              } catch (error) {
                console.error(`Error processing camera ${cam.slug}:`, error);
                return false;
              }
            }).length
          : 0;

        // 調試信息
        console.log(
          `Status calculation: actuallyOnline=${actuallyOnline}, available=${available}, latestCameras count=${
            latestCameras?.length || 0
          }`
        );

        statusDiv.innerHTML = `攝影機狀態: <span style="color: ${color};">${
          effectiveRunning ? "運行中" : "訊號延遲"
        }</span> | 上線: ${actuallyOnline}/${available} | 最後更新: ${lastUpdate}`;

        const systemStatus = document.getElementById("systemStatus");
        if (systemStatus) {
          const offlineCameras = (latestCameras || []).filter((cam) => {
            if (!cam?.enabled) return false;
            const camLastSeenDate = parseTimestamp(cam?.status?.last_seen);
            const camLastSeen = camLastSeenDate
              ? camLastSeenDate.getTime()
              : null;
            const camOnline = Boolean(cam?.status?.online);
            const camFresh =
              camLastSeen !== null &&
              now - camLastSeen < CAMERA_OFFLINE_THRESHOLD;
            return !(camOnline && camFresh);
          });
          const offlineNames = offlineCameras.map((cam) =>
            escapeHtml(cam.name || cam.slug)
          );
          const offlinePreview = offlineNames.slice(0, 3).join(", ");
          const offlineSuffix =
            offlineNames.length > 3 ? ` 等 ${offlineNames.length} 台` : "";

          systemStatus.innerHTML = `
                  <div>運行狀態：<strong>${
                    effectiveRunning ? "正常" : "待啟動"
                  }</strong></div>
                  <div>上線攝影機：${actuallyOnline}/${available}</div>
                  <div>最後更新時間：${lastUpdate}</div>
                  ${
                    offlineNames.length
                      ? `<div class="system-status-alert">離線攝影機：${offlinePreview}${offlineSuffix}</div>`
                      : `<div class="system-status-ok">所有攝影機皆在線</div>`
                  }
                `;
        }
      }

      // WebSocket connection
      function connectWebSocket() {
        const token = localStorage.getItem("access_token");
        if (!token) {
          console.log(
            "connectWebSocket: No token available, skipping WebSocket connection"
          );
          return;
        }
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/stream?token=${token}`;

        websocket = new WebSocket(wsUrl);

        websocket.onopen = function () {
          console.log("WebSocket connected");
        };
        websocket.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            updateDashboard(data);
            if (data.status) {
              updateCameraStatus(data.status);
            }
          } catch (e) {
            console.error("Error parsing WebSocket message:", e);
          }
        };
        websocket.onclose = function () {
          console.log("WebSocket disconnected");
          setTimeout(connectWebSocket, 3000);
        };
        websocket.onerror = function (error) {
          console.error("WebSocket error:", error);
        };
      }

      // 攝影機健康檢查
      function startCameraHealthCheck() {
        if (cameraHealthTimer) {
          clearInterval(cameraHealthTimer);
        }

        cameraHealthTimer = setInterval(() => {
          // 檢查所有攝影機的連接狀態
          const cameraCards = document.querySelectorAll(".video-card");
          cameraCards.forEach((card) => {
            const slug = card.dataset.cameraSlug;
            if (slug) {
              updateCameraCard(
                slug,
                latestCameras.find((cam) => cam.slug === slug)
              );
            }
          });
        }, 5000); // 每5秒檢查一次
      }

      function stopCameraHealthCheck() {
        if (cameraHealthTimer) {
          clearInterval(cameraHealthTimer);
          cameraHealthTimer = null;
        }
      }

      // Control functions
      async function startDetection() {
        if (!userHasPermission("detection_control")) {
          alert("\u6c92\u6709\u6b0a\u9650\u555f\u52d5\u5075\u6e2c\u3002");
          return;
        }

        const token = localStorage.getItem("access_token");
        if (!token) {
          alert(
            "\u767b\u5165\u72c0\u614b\u5df2\u5931\u6548\uff0c\u8acb\u91cd\u65b0\u767b\u5165\u3002"
          );
          await logout(true, "session_invalid");
          return;
        }

        if (detectionActionPending) {
          return;
        }

        detectionActionPending = true;
        applyDetectionButtonState();

        try {
          const response = await fetch("/api/v1/detection/start", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (!response.ok) {
            let detail = null;
            try {
              detail = await response.json();
            } catch (error) {
              // ignore json parse error
            }
            const message =
              (detail && (detail.detail || detail.message)) ||
              `\u555f\u52d5\u5075\u6e2c\u5931\u6557?${response.status}?`;
            alert(message);
            return;
          }

          alert("\u5075\u6e2c\u670d\u52d9\u5df2\u555f\u52d5\u3002");
        } catch (error) {
          console.error("Start detection failed:", error);
          alert(
            "\u555f\u52d5\u5075\u6e2c\u6642\u767c\u751f\u932f\u8aa4\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66\u3002"
          );
        } finally {
          detectionActionPending = false;
          applyDetectionButtonState();
        }
      }

      async function stopDetection() {
        if (!userHasPermission("detection_control")) {
          alert("\u6c92\u6709\u6b0a\u9650\u505c\u6b62\u5075\u6e2c\u3002");
          return;
        }

        const token = localStorage.getItem("access_token");
        if (!token) {
          alert(
            "\u767b\u5165\u72c0\u614b\u5df2\u5931\u6548\uff0c\u8acb\u91cd\u65b0\u767b\u5165\u3002"
          );
          await logout(true, "session_invalid");
          return;
        }

        if (detectionActionPending) {
          return;
        }

        detectionActionPending = true;
        applyDetectionButtonState();

        try {
          const response = await fetch("/api/v1/detection/stop", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (!response.ok) {
            let detail = null;
            try {
              detail = await response.json();
            } catch (error) {
              // ignore json parse error
            }
            const message =
              (detail && (detail.detail || detail.message)) ||
              `\u505c\u6b62\u5075\u6e2c\u5931\u6557?${response.status}?`;
            alert(message);
            return;
          }

          alert("\u5075\u6e2c\u670d\u52d9\u5df2\u505c\u6b62\u3002");
        } catch (error) {
          console.error("Stop detection failed:", error);
          alert(
            "\u505c\u6b62\u5075\u6e2c\u6642\u767c\u751f\u932f\u8aa4\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66\u3002"
          );
        } finally {
          detectionActionPending = false;
          applyDetectionButtonState();
        }
      }

      async function updateDetectionButtons() {
        try {
          const token = localStorage.getItem("access_token");
          const response = await fetch("/api/v1/detection/status", {
            headers: { Authorization: `Bearer ${token}` },
          });

          const result = await response.json();
          const startBtn = document.getElementById("startDetectionBtn");
          const stopBtn = document.getElementById("stopDetectionBtn");

          if (result.status === "running") {
            if (startBtn) {
              startBtn.disabled = true;
              startBtn.innerHTML = '<i class="fas fa-play"></i> 偵測運行中';
            }
            if (stopBtn) {
              stopBtn.disabled = false;
              stopBtn.innerHTML = '<i class="fas fa-stop"></i> 停止偵測';
            }
          } else {
            if (startBtn) {
              startBtn.disabled = false;
              startBtn.innerHTML = '<i class="fas fa-play"></i> 開始偵測';
            }
            if (stopBtn) {
              stopBtn.disabled = true;
              stopBtn.innerHTML = '<i class="fas fa-stop"></i> 偵測已停止';
            }
          }
        } catch (error) {
          console.error("Update detection buttons error:", error);
        }
      }

      async function refreshData() {
        try {
          // 顯示載入狀態
          showLoadingState();

          // 關閉現有的 WebSocket 連接
          if (websocket) {
            websocket.close();
            websocket = null;
          }

          // 重新載入所有數據
          await loadData();

          // 重新建立 WebSocket 連接
          setTimeout(() => {
            connectWebSocket();
          }, 1000);

          // 更新偵測按鈕狀態
          if (userHasPermission("detection_control")) {
            await updateDetectionButtons();
          }

          // 隱藏載入狀態
          hideLoadingState();

          console.log("數據刷新完成");
        } catch (error) {
          console.error("刷新數據失敗:", error);
          hideLoadingState();
          alert("刷新數據失敗，請稍後再試");
        }
      }

      async function logout(skipConfirm = false, reason = null) {
        console.log("=== logout() 被調用 ===");
        console.log("skipConfirm:", skipConfirm, "reason:", reason);
        let reasonToStore = reason;
        try {
          if (!skipConfirm) {
            const confirmed = confirm("確定要登出嗎？");
            if (!confirmed) return;
            if (!reasonToStore) {
              reasonToStore = "user_logout";
            }
          }

          if (metricsPollingTimer) {
            clearInterval(metricsPollingTimer);
            metricsPollingTimer = null;
          }
          clearRefreshTimer();
          cleanupHlsPlayers([]);
          if (websocket) {
            websocket.close();
            websocket = null;
          }

          const token = localStorage.getItem("access_token");
          if (token) {
            try {
              await fetch("/auth/logout", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
              });
            } catch (error) {
              console.warn("登出 API 調用失敗:", error);
            }
          }

          localStorage.removeItem("access_token");
          localStorage.removeItem("refresh_token");
          clearPersistedCurrentUser();

          redirectToLogin(reasonToStore);
        } catch (error) {
          console.error("登出過程中發生錯誤:", error);
          localStorage.removeItem("access_token");
          localStorage.removeItem("refresh_token");
          clearPersistedCurrentUser();
          redirectToLogin(reasonToStore || "session_invalid");
        }
      }

      // Cleanup
      window.addEventListener("beforeunload", function () {
        if (metricsPollingTimer) {
          clearInterval(metricsPollingTimer);
          metricsPollingTimer = null;
        }

        // 停止攝影機健康檢查
        stopCameraHealthCheck();
        clearRefreshTimer();
        if (websocket) websocket.close();
        cleanupHlsPlayers([]);
      });
    </script>
  </body>
</html>
