<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YOLO／LearnSight 端對端架構</title>
  <desc id="desc">前置鏡頭或影片經 YOLOv8n 偵測及 ByteTrack 追蹤，轉換成具來源、時間戳、人數與狀態的訊號，經 FastAPI 傳送到 LearnSight。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#456174"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17394b" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f7fafc}.title{font:700 44px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#17384a}.subtitle{font:400 23px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#536b78}.box{fill:#fff;stroke:#cbd8df;stroke-width:2;rx:22;filter:url(#shadow)}.input{fill:#edf6fb;stroke:#6c9db9}.model{fill:#e9f6ee;stroke:#5f9c76}.signal{fill:#fff3dd;stroke:#c8963e}.service{fill:#f1edfb;stroke:#8e76b3}.app{fill:#e6f5f0;stroke:#4f917d}.label{font:700 25px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#1d3a49}.body{font:400 20px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#425b68}.small{font:400 18px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#59717e}.arrow{stroke:#456174;stroke-width:4;fill:none;marker-end:url(#arrow)}.line{stroke:#8298a5;stroke-width:3;fill:none}.warn{fill:#fff7e7;stroke:#cf9b44;stroke-width:2;rx:20}.warntext{font:700 20px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#815b19}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="800" y="70" text-anchor="middle">YOLO／LearnSight 端對端架構</text>
  <text class="subtitle" x="800" y="110" text-anchor="middle">將「有框的影像」轉成學習系統可正確解讀的可追溯訊號</text>

  <rect class="box input" x="55" y="245" width="235" height="230"/>
  <text class="label" x="173" y="305" text-anchor="middle">影像輸入</text>
  <text class="body" x="92" y="365">• 筆電前置鏡頭</text>
  <text class="body" x="92" y="408">• 本機影片</text>
  <text class="body" x="92" y="451">• 授權測試素材</text>

  <rect class="box model" x="350" y="245" width="255" height="230"/>
  <text class="label" x="478" y="305" text-anchor="middle">YOLOv8n</text>
  <text class="body" x="397" y="365">• 人物框偵測</text>
  <text class="body" x="397" y="408">• 信心分數</text>
  <text class="body" x="397" y="451">• CPU／GPU 推論</text>

  <rect class="box model" x="665" y="245" width="235" height="230"/>
  <text class="label" x="783" y="305" text-anchor="middle">ByteTrack</text>
  <text class="body" x="710" y="365">• 追蹤人物</text>
  <text class="body" x="710" y="408">• 統計畫面人數</text>

  <rect class="box signal" x="960" y="190" width="290" height="340"/>
  <text class="label" x="1105" y="250" text-anchor="middle">訊號轉換與驗證</text>
  <text class="body" x="1002" y="310">• source_id：來源</text>
  <text class="body" x="1002" y="353">• observed_at：時間</text>
  <text class="body" x="1002" y="396">• person_count：人數</text>
  <text class="body" x="1002" y="439">• status：狀態</text>
  <text class="body" x="1002" y="482">• expires_at：有效期</text>

  <rect class="box service" x="1310" y="245" width="235" height="230"/>
  <text class="label" x="1428" y="300" text-anchor="middle">FastAPI</text>
  <text class="body" x="1350" y="360">• JWT 驗證</text>
  <text class="body" x="1350" y="403">• SQLite 記錄</text>
  <text class="body" x="1350" y="446">• 健康狀態</text>

  <rect class="box app" x="535" y="645" width="530" height="155"/>
  <text class="label" x="800" y="700" text-anchor="middle">AI-Learning-System／LearnSight</text>
  <text class="body" x="590" y="752">顯示有人、有效零人、等待、過期、離線與來源錯配</text>

  <path class="arrow" d="M290 360 H335"/><path class="arrow" d="M605 360 H650"/><path class="arrow" d="M900 360 H945"/><path class="arrow" d="M1250 360 H1295"/>
  <path class="arrow" d="M1428 475 C1428 610 1110 620 1035 675"/>

  <rect class="warn" x="105" y="605" width="350" height="165"/>
  <text class="warntext" x="280" y="655" text-anchor="middle">重要邊界</text>
  <text class="body" x="145" y="700">有人 ≠ 專注</text>
  <text class="body" x="145" y="740">無資料 ≠ 有效零人</text>
  <path class="line" d="M455 690 H520"/>

  <text class="small" x="800" y="860" text-anchor="middle">實機證據：前置鏡頭 `1 → 0 → 1` 流程 67.9 秒；38 項測試通過</text>
</svg>
