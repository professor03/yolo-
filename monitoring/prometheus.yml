# Prometheus配置 - P3企業級監控
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'yolo-detection'
    environment: 'production'

# 規則檔案
rule_files:
  - "rules/*.yml"

# 告警配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 抓取配置
scrape_configs:
  # YOLO API服務
  - job_name: 'yolo-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # YOLO檢測服務
  - job_name: 'yolo-detector'
    static_configs:
      - targets: ['detector:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # 系統監控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s